name: DevFlow CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: Frontend CI (React 19 + TypeScript + Vite)
  # ==========================================
  frontend-ci:
    name: 💻 Frontend CI (Build & Lint)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: 🔍 Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: 🏗️ Build React Frontend Application
        working-directory: ./frontend
        run: npm run build

      - name: 📤 Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devflow-frontend-dist
          path: frontend/dist
          retention-days: 7

  # ==========================================
  # JOB 2: Backend CI (Spring Boot 3.3 + Java 21 Multi-Module)
  # ==========================================
  backend-ci:
    name: ☕ Backend Microservices CI (Java 21 + Maven)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21 (Temurin JDK)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🛠️ Build & Package All Microservices
        run: mvn clean package -DskipTests=true --batch-mode --errors

      - name: 🧪 Run Microservice Unit Tests
        run: mvn test --batch-mode --errors

      - name: 📤 Upload Microservice JAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devflow-backend-jars
          path: |
            */target/*.jar
            !*/target/*-sources.jar
          retention-days: 7

  # ==========================================
  # JOB 3: Infrastructure & Docker Compose Validation
  # ==========================================
  docker-validation:
    name: 🐳 Docker & Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config > /dev/null

      - name: 🔍 Validate docker-compose.core.yml
        run: docker compose -f docker-compose.core.yml config > /dev/null

  # ==========================================
  # JOB 4: CI/CD Pipeline Summary & Deployment Ready
  # ==========================================
  ci-cd-summary:
    name: ✅ CI/CD Status Summary
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci, docker-validation]
    if: always()

    steps:
      - name: 📊 Evaluate Pipeline Results
        run: |
          if [[ "${{ needs.frontend-ci.result }}" == "success" && "${{ needs.backend-ci.result }}" == "success" && "${{ needs.docker-validation.result }}" == "success" ]]; then
            echo "=========================================="
            echo "🚀 DevFlow CI/CD Pipeline PASSED SUCCESSFULLY!"
            echo "All microservices and frontend built cleanly."
            echo "=========================================="
            exit 0
          else
            echo "=========================================="
            echo "❌ DevFlow CI/CD Pipeline FAILED!"
            echo "Frontend: ${{ needs.frontend-ci.result }}"
            echo "Backend: ${{ needs.backend-ci.result }}"
            echo "Docker Validation: ${{ needs.docker-validation.result }}"
            echo "=========================================="
            exit 1
          fi
