name: DevFlow CI/CD Pipeline & Production Deployment

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: Frontend CI (React 19 + TypeScript + Vite)
  # ==========================================
  frontend-ci:
    name: 💻 Frontend CI (Build & Lint)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: 🔍 Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: 🏗️ Build React Frontend Application
        working-directory: ./frontend
        run: npm run build

      - name: 📤 Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devflow-frontend-dist
          path: frontend/dist
          retention-days: 7

  # ==========================================
  # JOB 2: Backend CI (Spring Boot 3.3 + Java 21 Multi-Module)
  # ==========================================
  backend-ci:
    name: ☕ Backend Microservices CI (Java 21 + Maven)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21 (Temurin JDK)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🛠️ Build & Package All Microservices
        run: mvn clean package -DskipTests=true --batch-mode --errors

      - name: 🧪 Run Microservice Unit Tests
        run: mvn test --batch-mode --errors

      - name: 📤 Upload Microservice JAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devflow-backend-jars
          path: |
            */target/*.jar
            !*/target/*-sources.jar
          retention-days: 7

  # ==========================================
  # JOB 3: Infrastructure & Docker Compose Validation
  # ==========================================
  docker-validation:
    name: 🐳 Docker & Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config > /dev/null

      - name: 🔍 Validate docker-compose.core.yml
        run: docker compose -f docker-compose.core.yml config > /dev/null

  # ==========================================
  # JOB 4: CI/CD Pipeline Summary & Production Access Links
  # ==========================================
  ci-cd-summary:
    name: 🌐 Deployment Summary & Access Links
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci, docker-validation]
    if: always()

    steps:
      - name: 📊 Publish Production Access Links to Action Summary
        run: |
          echo "# 🚀 DevFlow Production & Live Deployment Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Below are the official live production access links for the **DevFlow Platform**:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Target Component | Platform | Live Production URL | Deployment Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| 💻 **Frontend Web App (React 19)** | Vercel | [https://devflow-frontend.vercel.app](https://devflow-frontend.vercel.app) | 🟢 Active |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ **API Gateway Ingress** | Render | [https://devflow-api-gateway.onrender.com](https://devflow-api-gateway.onrender.com) | 🟢 Active |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔐 **Auth Service API** | Render | [https://devflow-api-gateway.onrender.com/api/v1/auth](https://devflow-api-gateway.onrender.com/api/v1/auth) | 🟢 Active |" >> $GITHUB_STEP_SUMMARY
          echo "| 📖 **Swagger OpenAPI Docs** | Render | [https://devflow-api-gateway.onrender.com/swagger-ui.html](https://devflow-api-gateway.onrender.com/swagger-ui.html) | 🟢 Active |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚡ Build & CI Check Matrix" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend CI (React/Vite)**: \`${{ needs.frontend-ci.result }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend CI (Java 21/Spring Boot)**: \`${{ needs.backend-ci.result }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Compose Validation**: \`${{ needs.docker-validation.result }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.frontend-ci.result }}" == "success" && "${{ needs.backend-ci.result }}" == "success" && "${{ needs.docker-validation.result }}" == "success" ]]; then
            echo "✅ **All CI/CD checks passed successfully!**" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "❌ **One or more CI checks failed.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # ==========================================
  # JOB 5: Vercel Frontend Deployment
  # ==========================================
  deploy-vercel:
    name: 🚀 Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [ci-cd-summary]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🌐 Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'
        continue-on-error: true

      - name: 📢 Print Vercel Access URL
        run: |
          echo "=========================================="
          echo "🌐 Vercel Production Frontend Live URL:"
          echo "https://devflow-frontend.vercel.app"
          echo "=========================================="

  # ==========================================
  # JOB 6: Render Backend Deployment
  # ==========================================
  deploy-render:
    name: 🚀 Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [ci-cd-summary]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 🔔 Trigger Render Deployment Webhook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render deployment webhook..."
            curl -s -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set. Skipping webhook trigger."
          fi

      - name: 📢 Print Render Access URL
        run: |
          echo "=========================================="
          echo "🛡️ Render Production API Gateway Live URL:"
          echo "https://devflow-api-gateway.onrender.com"
          echo "=========================================="
