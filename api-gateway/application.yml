server:
  port: 9080

spring:
  application:
    name: api-gateway

  # ── Redis ────────────────────────────────────────────
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD:devflow_secret}

  # ── Routes ───────────────────────────────────────────
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4000"
              - "https://devflow.io"
            allowedMethods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true
            maxAge: 3600

      # Rate limiter disabled for local development
      default-filters: []

      routes:
        # ── Auth Service (public) ─────────────────────
        - id: auth-public
          uri: http://${AUTH_SERVICE_HOST:localhost}:9081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0

        # ── Auth Service (protected) ──────────────────
        - id: auth-protected
          uri: http://${AUTH_SERVICE_HOST:localhost}:9081
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=0
            - JwtAuthenticationFilter

        # ── Project Service ───────────────────────────
        - id: project-service
          uri: http://${PROJECT_SERVICE_HOST:localhost}:9082
          predicates:
            - Path=/api/v1/projects,/api/v1/projects/**,/api/v1/sprints,/api/v1/sprints/**,/api/v1/epics,/api/v1/epics/**
          filters:
            - StripPrefix=0
            - JwtAuthenticationFilter

        # ── Task Service ──────────────────────────────
        - id: task-service
          uri: http://${TASK_SERVICE_HOST:localhost}:9083
          predicates:
            - Path=/api/v1/tasks,/api/v1/tasks/**,/api/v1/boards,/api/v1/boards/**,/api/v1/comments/**,/api/v1/time-logs/**
          filters:
            - StripPrefix=0
            - JwtAuthenticationFilter

        # ── AI Engine ─────────────────────────────────
        - id: ai-engine
          uri: http://${AI_ENGINE_HOST:localhost}:9084
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - StripPrefix=0
            - JwtAuthenticationFilter

        # ── Notification Service ──────────────────────
        - id: notification-service
          uri: http://${NOTIFICATION_SERVICE_HOST:localhost}:9085
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=0
            - JwtAuthenticationFilter

        # ── Analytics Service ─────────────────────────
        - id: analytics-service
          uri: http://${ANALYTICS_SERVICE_HOST:localhost}:9086
          predicates:
            - Path=/api/v1/analytics/**,/api/v1/reports/**
          filters:
            - StripPrefix=0
            - JwtAuthenticationFilter

        # ── Integration Service ───────────────────────
        - id: integration-service
          uri: http://${INTEGRATION_SERVICE_HOST:localhost}:9087
          predicates:
            - Path=/api/v1/integrations/**,/api/v1/webhooks/**
          filters:
            - StripPrefix=0
            - JwtAuthenticationFilter

        # ── Realtime WebSocket ────────────────────────
        - id: realtime-ws
          uri: ws://${REALTIME_SERVICE_HOST:localhost}:9088
          predicates:
            - Path=/ws/**
          filters:
            - StripPrefix=0

# ── JWT ──────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:ZGV2Zmxvd19qd3Rfc2VjcmV0X2tleV8yMDI2X211c3RfYmVfYXRfbGVhc3RfMjU2X2JpdHNfbG9uZ19mb3JfaHMyNTY=}
  access-token-expiry: 3600000   # 1 hour
  refresh-token-expiry: 604800000 # 7 days

# ── Resilience4j ─────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      defaultCB:
        registerHealthIndicator: true
        slidingWindowSize: 50
        permittedNumberOfCallsInHalfOpenState: 10
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 20
        waitDurationInOpenState: 3s
        failureRateThreshold: 80
        automaticTransitionFromOpenToHalfOpenEnabled: true

# ── Actuator / Observability ─────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://${JAEGER_HOST:jaeger}:4317

logging:
  level:
    com.devflow: DEBUG
    org.springframework.cloud.gateway: INFO
